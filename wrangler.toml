# wrangler.toml — Tripwire Worker (serves the SPA + /api/*).
#
# Deploy is human-gated (needs `wrangler login`). Before first deploy:
#   1. wrangler kv namespace create DAILY        # paste the id below
#   2. wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   3. wrangler secret put DEEPFAKE_API_KEY
#   4. npm run build && wrangler deploy
#
# Secrets are NEVER placed in this file.

name = "tripwire"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Static SPA. The Worker handles /api/*; everything else falls through to assets,
# and unknown routes serve index.html for client-side routing.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
# Non-secret configuration.
SUPABASE_URL = "https://cdmbaujqfnknilruuhht.supabase.co"
DEEPFAKE_ROUTER_URL = "https://vincentsider--deepblocker-audio-api-fastapi-app-router.modal.run"
DETECTOR_DAILY_CAP = "500"
# Comma-separated extra origins allowed to call the API (e.g. a quarantine
# subdomain). Empty = same-origin only, which needs no CORS.
ALLOWED_ORIGINS = ""

# Per-IP-per-route short-window limit (writes + detector). Period must be 10 or 60.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Daily-ceiling counter for the paid detector call. Create the namespace and
# paste its id here before deploy (see header). Until then the detector endpoint
# fails closed (503), which is the safe default.
[[kv_namespaces]]
binding = "DAILY"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Keep the detector warm across the judging window.
[triggers]
crons = ["*/3 * * * *"]
